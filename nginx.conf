map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Proxy Firebase Auth handler so signInWithRedirect stays same-origin on Cloud Run
    location /__/ {
        proxy_pass https://fde-capstone-510119.firebaseapp.com/__/;
        proxy_ssl_server_name on;
        proxy_set_header Host fde-capstone-510119.firebaseapp.com;
    }

    # Reverse-proxy all /api/* REST and /api/chat/stream WebSocket traffic over the VPC to capstone-backend
    location /api/ {
        proxy_pass https://capstone-backend-2gqoy3ieaq-uc.a.run.app/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # SPA fallback so React routes never 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for Cloud Run probes
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}